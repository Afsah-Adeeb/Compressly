    .axis    { stroke: #55534d; }
    .title   { fill: #ffffff; }
    .label   { fill: #c3c2b7; }
    .muted   { fill: #93918a; }
    .series  { stroke: #3987e5; }
    .dot     { fill: #3987e5; stroke: #1a1a19; }
    .refline { stroke: #55534d; }
    .callout { fill: #ffffff; }
  }
</style>
